<!doctype html>
<html lang="ar"dir="rtl" >
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>عيادة نور لطب الأسنان، احجز موعدك</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f7fd;
        --fg: #10244a;
        --ac: #1d4ed8;
        --onac: #fff;
        --card: #fff;
        --mut: #58688a;
        --line: #d5deef;
        --busy: #e6eaf3;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b1428;
          --fg: #e8eefc;
          --ac: #6c92ff;
          --onac: #0b1428;
          --card: #121d38;
          --mut: #9aa9cc;
          --line: #25335a;
          --busy: #18233f;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b1428;
        --fg: #e8eefc;
        --ac: #6c92ff;
        --onac: #0b1428;
        --card: #121d38;
        --mut: #9aa9cc;
        --line: #25335a;
        --busy: #18233f;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          400 17px/1.8 Cairo,
          Tahoma,
          sans-serif;
      }
      .w {
        max-width: 1040px;
        margin: auto;
        padding: 0 22px;
      }
      nav {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        padding: 18px 0;
      }
      nav b {
        font-weight: 800;
        font-size: 22px;
        color: var(--ac);
      }
      nav span {
        color: var(--mut);
        font-size: 15px;
      }
      h1 {
        font-weight: 800;
        font-size: clamp(34px, 6vw, 60px);
        line-height: 1.25;
        margin: 28px 0 10px;
      }
      .lead {
        color: var(--mut);
        max-width: 44ch;
        margin: 0 0 34px;
      }
      .main {
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 28px;
        align-items: start;
        padding-bottom: 50px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 26px;
      }
      h2 {
        font-size: 20px;
        font-weight: 800;
        margin: 26px 0 12px;
      }
      h2:first-child {
        margin-top: 0;
      }
      .opts {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .opts button {
        font: inherit;
        line-height: 1.5;
        color: var(--fg);
        background: var(--bg);
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 9px 16px;
        cursor: pointer;
        text-align: center;
        min-width: 92px;
      }
      .opts button small {
        display: block;
        font-size: 13px;
        color: var(--mut);
      }
      .opts button[aria-pressed="true"] {
        background: var(--ac);
        border-color: var(--ac);
        color: var(--onac);
      }
      .opts button[aria-pressed="true"] small {
        color: var(--onac);
      }
      .opts button:disabled {
        background: var(--busy);
        color: var(--mut);
        cursor: not-allowed;
        text-decoration: line-through;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--ac);
        outline-offset: 2px;
      }
      .mut {
        color: var(--mut);
        margin: 0;
      }
      label {
        display: block;
        margin: 0 0 12px;
        font-weight: 600;
      }
      input {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }
      .go {
        font: inherit;
        font-weight: 800;
        background: var(--ac);
        color: var(--onac);
        border: 0;
        border-radius: 12px;
        padding: 13px 30px;
        cursor: pointer;
      }
      #er {
        color: #c0392b;
        min-height: 1.6em;
        margin: 4px 0 8px;
      }
      aside.card {
        position: sticky;
        top: 16px;
      }
      aside h3 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 14px;
      }
      dt {
        color: var(--mut);
      }
      dd {
        margin: 0;
        font-weight: 600;
      }
      .no {
        font-size: 22px;
        font-weight: 800;
        color: var(--ac);
        margin: 0 0 10px;
      }
      .ghost {
        font: inherit;
        background: none;
        color: var(--fg);
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 8px 18px;
        cursor: pointer;
        margin-top: 14px;
      }
      @media (max-width: 800px) {
        .main {
          grid-template-columns: 1fr;
        }
        aside.card {
          position: static;
        }
      }
      footer {
        padding: 26px 0;
        color: var(--mut);
      }
      .rq {
        margin: 12px 0 0;
        padding: 10px 14px;
        border-radius: 10px;
        background: var(--busy);
        font-size: 15px;
      }
      .rq:empty {
        display: none;
      }
      .sms {
        margin: 10px 0;
        padding: 12px 14px;
        border-radius: 14px 14px 14px 4px;
        background: var(--busy);
        font-size: 15px;
      }
      .sms b {
        display: block;
        color: var(--mut);
        font-size: 13px;
      }
      .er {
        color: #c0392b;
        min-height: 1.4em;
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <div class="w">
      <nav><b>عيادة نور</b><span>من السبت إلى الخميس، 10 ص حتى 8 م</span></nav>
      <h1>احجز موعدك في أقل من دقيقة</h1>
      <p class="lead">
        اختر الخدمة واليوم والساعة المتاحة، وسيصلك رقم حجز فورًا.
      </p>
      <div class="main">
        <section class="card" aria-label="نموذج الحجز">
          <h2>1. اختر الخدمة</h2>
          <div class="opts" id="sv"></div>
          <p class="rq" id="rq" aria-live="polite"></p>
          <h2>2. اختر اليوم</h2>
          <div class="opts" id="dy"></div>
          <h2>3. اختر الساعة</h2>
          <div class="opts" id="tm" aria-live="polite"></div>
          <h2>4. بياناتك</h2>
          <label>الاسم<input id="nm" autocomplete="name" /></label
          ><label
            >رقم الموبايل<input
              id="ph"
              type="tel"
              inputmode="tel"
              placeholder="01xxxxxxxxx"
              autocomplete="tel"
          /></label>
          <p id="er" role="alert"></p>
          <button class="go" id="go" type="button">أكّد الحجز</button>
        </section>
        <aside class="card" id="sum" aria-live="polite"></aside>
      </div>
    </div>
    <footer class="w">موقع تجريبي ضمن معرض أعمالي</footer>
    <script>
      (function () {
        var $ = function (i) {
            return document.getElementById(i);
          },
          S = [
            [
              "كشف وتشخيص",
              30,
              200,
              "لا يلزم شيء. أحضر أي أشعة أو تحاليل سابقة إن وُجدت.",
            ],
            [
              "تنظيف الأسنان",
              45,
              350,
              "لا يلزم شيء. أبلغنا إن كانت لديك أمراض مزمنة أو تتناول أدوية، مثل مسيّلات الدم.",
            ],
            [
              "حشو عادي",
              60,
              500,
              "أشعة سينية حديثة للسن (خلال 6 أشهر)، وإن لم تتوفر نجريها في العيادة.",
            ],
            [
              "استشارة تقويم",
              30,
              250,
              "أشعة بانوراما وأشعة سيفالومتري (خلال سنة)، مع أي تقارير تقويم سابقة.",
            ],
          ],
          st = { s: null, d: null, t: null },
          bk = {},
          tk = null,
          days = [],
          d = new Date();
        d.setHours(0, 0, 0, 0);
        while (days.length < 7) {
          if (d.getDay() !== 5) days.push(new Date(d));
          d.setDate(d.getDate() + 1);
        }
        function key(x) {
          return x.toDateString();
        }
        function fmt(h) {
          return (h > 12 ? h - 12 : h) + ":00 " + (h >= 12 ? "م" : "ص");
        }
        function ds(x, o) {
          return x.toLocaleDateString("ar-EG", o);
        }
        function esc(s) {
          return s.replace(/[&<>]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
          });
        }
        function btn(t, sub, on, fn, dis) {
          var b = document.createElement("button");
          b.type = "button";
          b.innerHTML = t + (sub ? "<small>" + sub + "</small>" : "");
          b.setAttribute("aria-pressed", !!on);
          b.disabled = !!dis;
          b.onclick = fn;
          return b;
        }
        function r() {
          $("rq").textContent =
            st.s === null ? "" : "المطلوب قبل الموعد: " + S[st.s][3];
          var a = $("sv");
          a.innerHTML = "";
          S.forEach(function (x, i) {
            a.appendChild(
              btn(
                x[0],
                x[1] + " دقيقة، " + x[2] + " ج",
                st.s === i,
                function () {
                  st.s = i;
                  r();
                },
              ),
            );
          });
          a = $("dy");
          a.innerHTML = "";
          days.forEach(function (x, i) {
            a.appendChild(
              btn(
                ds(x, { weekday: "long" }),
                ds(x, { day: "numeric", month: "long" }),
                st.d === i,
                function () {
                  st.d = i;
                  st.t = null;
                  r();
                },
              ),
            );
          });
          a = $("tm");
          a.innerHTML = "";
          if (st.d === null) {
            a.innerHTML =
              '<p class="mut">اختر اليوم أولًا لعرض الساعات المتاحة.</p>';
          } else {
            var x = days[st.d],
              now = Date.now();
            for (var h = 10; h < 20; h++) {
              (function (h) {
                var busy =
                    (x.getDate() * 7 + h * 3) % 5 === 0 || bk[key(x) + h],
                  past = x.getTime() + h * 36e5 <= now;
                a.appendChild(
                  btn(
                    fmt(h),
                    busy ? "محجوز" : "",
                    st.t === h,
                    function () {
                      st.t = h;
                      r();
                    },
                    busy || past,
                  ),
                );
              })(h);
            }
          }
          sum();
        }
        function rows(s, x, h, p) {
          return (
            "<dl><dt>الخدمة</dt><dd>" +
            (s ? s[0] : "لم تُحدَّد") +
            "</dd><dt>اليوم</dt><dd>" +
            (x
              ? ds(x, { weekday: "long", day: "numeric", month: "long" })
              : "لم يُحدَّد") +
            "</dd><dt>الساعة</dt><dd>" +
            (h === null ? "لم تُحدَّد" : fmt(h)) +
            "</dd><dt>السعر</dt><dd>" +
            (s ? s[2] + " ج" : "-") +
            "</dd><dt>قبل الموعد</dt><dd>" +
            (s ? s[3] : "-") +
            "</dd></dl>"
          );
        }
        function sum() {
          var o = $("sum");
          if (tk) {
            var m = tk.p.slice(0, 3) + "****" + tk.p.slice(-3),
              sms =
                "عيادة نور: رقم حجزك #" +
                tk.no +
                " يوم " +
                ds(tk.d, { weekday: "long", day: "numeric", month: "long" }) +
                " الساعة " +
                fmt(tk.t) +
                ". كود التأكيد: " +
                tk.c +
                ". لا تشارك الكود مع أحد.";
            o.innerHTML =
              "<h3>" +
              (tk.ok ? "تم تأكيد حجزك" : "خطوة أخيرة: أكّد حجزك") +
              '</h3><p class="no">رقم الحجز #' +
              tk.no +
              "</p>" +
              rows(tk.s, tk.d, tk.t) +
              '<p class="mut" style="margin-top:12px">أهلًا ' +
              esc(tk.n) +
              ". أُرسلت رسالة نصية إلى " +
              m +
              ' (عرض تجريبي).</p><div class="sms" role="note"><b>الرسالة النصية</b>' +
              sms +
              "</div>" +
              (tk.ok
                ? '<p class="no" style="font-size:16px">الحالة: مؤكد. سنرسل تذكيرًا قبل الموعد بيوم، ولا نكتب أي بيانات طبية في الرسائل.</p>'
                : '<label>أدخل الكود المكوّن من 4 أرقام<input id="cd" inputmode="numeric" maxlength="4" autocomplete="one-time-code"></label><p id="ce" role="alert" class="er"></p><button class="go" id="cv" type="button">تأكيد الكود</button>') +
              '<br><button class="ghost" id="cx" type="button">إلغاء الحجز</button>';
            if (!tk.ok)
              $("cv").onclick = function () {
                if ($("cd").value.trim() === tk.c) {
                  tk.ok = true;
                  sum();
                } else
                  $("ce").textContent =
                    "الكود غير صحيح. راجع الرسالة وأعد المحاولة.";
              };
            $("cx").onclick = function () {
              delete bk[tk.k];
              tk = null;
              st.t = null;
              r();
            };
            return;
          }
          o.innerHTML =
            "<h3>ملخص الحجز</h3>" +
            rows(
              st.s === null ? null : S[st.s],
              st.d === null ? null : days[st.d],
              st.t,
            );
        }
        $("go").onclick = function () {
          var n = $("nm").value.trim(),
            p = $("ph").value.trim(),
            e = $("er");
          if (tk) {
            e.textContent = "لديك حجز مؤكد. ألغِه أولًا لحجز موعد آخر.";
            return;
          }
          if (st.s === null || st.d === null || st.t === null) {
            e.textContent = "اختر الخدمة واليوم والساعة أولًا.";
            return;
          }
          if (!n) {
            e.textContent = "اكتب اسمك.";
            return;
          }
          if (!/^01\d{9}$/.test(p)) {
            e.textContent = "اكتب رقم موبايل صحيحًا من 11 رقمًا يبدأ بـ 01.";
            return;
          }
          e.textContent = "";
          var k = key(days[st.d]) + st.t;
          bk[k] = 1;
          tk = {
            no: Math.floor(1000 + Math.random() * 9000),
            c: String(Math.floor(1000 + Math.random() * 9000)),
            ok: false,
            k: k,
            n: n,
            p: p,
            s: S[st.s],
            d: days[st.d],
            t: st.t,
          };
          r();
        };
        r();
      })();
    </script>
  </body>
</html>
